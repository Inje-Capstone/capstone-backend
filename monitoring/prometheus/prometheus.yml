global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lookie-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:9091

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - develop

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy backend via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "runuser -u ssm-user -- git -C /home/ssm-user/app/capstone-backend fetch origin",
              "runuser -u ssm-user -- git -C /home/ssm-user/app/capstone-backend reset --hard origin/develop",
              "cd /home/ssm-user/app/capstone-backend",
              "docker compose up -d --build",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # 최대 약 10분 동안 SSM 명령 상태 확인
          DEPLOY_STATUS="Pending"
          STATUS_ERROR_FILE="$RUNNER_TEMP/ssm-status-error.log"

          for attempt in {1..60}; do
            if DEPLOY_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>"$STATUS_ERROR_FILE"); then

              echo "[$attempt/60] SSM status: $DEPLOY_STATUS"

              case "$DEPLOY_STATUS" in
                Success|Failed|Cancelled|TimedOut)
                  break
                  ;;
              esac
            elif grep -q "InvocationDoesNotExist" "$STATUS_ERROR_FILE"; then
              DEPLOY_STATUS="Pending"
              echo "[$attempt/60] Waiting for SSM invocation"
            else
              cat "$STATUS_ERROR_FILE" >&2
              exit 1
            fi

            sleep 10
          done

          # 성공·실패 판단 전에 서버 실행 결과 출력
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [ "$DEPLOY_STATUS" != "Success" ]; then
            echo "Deployment did not succeed within the wait limit. Last status: $DEPLOY_STATUS"
            exit 1
          fi